<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundial 2026 - Transmisiones en Vivo</title>
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --accent-color: #e0a96d;
            --text-color: #ffffff;
            --btn-color: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* --- CONTENEDOR CENTRAL (TARJETA) --- */
        .main-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #cccccc;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        /* --- FOTO DEL MUNDIAL --- */
        .promo-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 35px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* --- BOTÓN PRINCIPAL DE REDIRECCIÓN --- */
        .btn-action {
            display: inline-block;
            background-color: var(--btn-color);
            color: #ffffff;
            border: none;
            padding: 16px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-action:hover {
            background-color: #1d4ed8;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1>🏆 Mundial 2026 🏆</h1>
        <p class="subtitle">Disfruta de todos los partidos en vivo, directo y en alta calidad de forma gratuita.</p>
        
        <img class="promo-image" src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop" alt="Mundial 2026">

        <button class="btn-action" onclick="irAlMundial()">
            👉 PINCHA AQUÍ PARA VER EL PARTIDO
        </button>
    </div>

    <footer>
        <p>&copy; 2026 - Directorio de Transmisiones Deportivas</p>
    </footer>

    <script>
        // Enlaces de destino configurados
        const ENLACE_MONETAG = "https://omg10.com/4/11061922";
        const ENLACE_STREAMING = "https://futbol-libres.su/";

        function irAlMundial() {
            // 1. Abre tu publicidad de Monetag en una pestaña nueva para generar tus ingresos
            window.open(ENLACE_MONETAG, "_blank");

            // 2. Redirecciona inmediatamente la pestaña actual a la plataforma que transmite el fútbol
            window.location.href = ENLACE_STREAMING;
        }
    </script>
</body>
</html>
